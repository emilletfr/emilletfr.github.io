<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.meta_description | default: site.description | escape }}">
  <link rel="canonical" href="{{ site.url }}{{ page.url | replace: 'index.html', '' }}">
  <link rel="icon" type="image/png" href="/images/logo-idictee.png">
  <link rel="stylesheet" href="/css/site.css?v={{ site.time | date: '%Y%m%d%H%M' }}">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.meta_description | default: site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  {% if page.url == '/' %}<link rel="alternate" hreflang="de" href="{{ site.url }}/de/">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}/">{% endif %}
  {% if page.url == '/de/' %}<link rel="alternate" hreflang="fr" href="{{ site.url }}/">
  <link rel="alternate" hreflang="x-default" href="{{ site.url }}/">{% endif %}
</head>
