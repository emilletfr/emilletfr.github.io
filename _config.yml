# appseven.fr — configuration Jekyll (refonte K19)
title:       AppSeven
description: "Applications iOS et Android conçues et réalisées en France."
url:         "https://www.appseven.fr"
baseurl:     ""
author:      Eric Millet
email:       emilletfr@gmail.com
lang:        fr

# Textes d'interface utilisés par les gabarits
text:
  contact:
    subject: 'Message depuis appseven.fr'
  thanks: 'Merci pour votre message. Nous vous répondrons dès que possible.'

# Build — plugin limité à la liste blanche GitHub Pages
markdown:   kramdown
permalink:  pretty
plugins:
  - jekyll-sitemap
exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
  - script
